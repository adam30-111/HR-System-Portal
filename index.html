<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #eef2f6;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6b82;
    --line: #cfd8e3;
    --accent: #0f6e8c;
    --accent-dark: #0b5a73;
    --accent-soft: #dcecf2;
    --error: #a63a2b;
    --error-soft: #f8e4e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Instrument Sans", system-ui, sans-serif;
  }
  .app {
    max-width: 760px; min-height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--paper); border-inline: 1px solid var(--line);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .avatar {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #fff;
    font-weight: 600; font-size: .85rem;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }

  main { flex: 1; padding: 28px 20px; display: flex; flex-direction: column; gap: 32px; }
  .intro h2, .section h2 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 600; }
  .intro p, .section > p { margin: 0 0 16px; color: var(--muted); }
  .intro p { margin: 0; }

  /* Quick links */
  #links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .link-card {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 18px;
    transition: border-color .15s, transform .15s;
  }
  .link-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .link-card:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  .link-icon {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent-soft); font-size: 1.3rem;
  }
  .link-text strong { display: block; font-weight: 600; }
  .link-text span { display: block; font-size: .88rem; color: var(--muted); }
  .link-arrow { margin-inline-start: auto; color: var(--accent); font-weight: 600; }

  /* Open positions */
  #positions { display: flex; flex-direction: column; gap: 12px; }
  .job {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 18px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px;
  }
  .job-text { flex: 1; min-width: 180px; }
  .job-text strong { display: block; font-weight: 600; }
  .job-text span { display: block; font-size: .88rem; color: var(--muted); }
  .refer {
    padding: 9px 20px; text-decoration: none; font-weight: 600; font-size: .95rem; color: #fff;
    background: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px;
  }
  .refer:hover { background: var(--accent-dark); }
  .refer:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }

  .note {
    padding: 14px 18px; border-radius: 18px; background: var(--card);
    border: 1.5px dashed var(--line); color: var(--muted);
  }
  .note.error { background: var(--error-soft); border: 1px solid #e3b8b0; color: var(--error); }
  .retry {
    margin-inline-start: 8px; padding: 4px 14px; font: 600 .9rem "Instrument Sans", sans-serif;
    color: var(--error); background: transparent; border: 1.5px solid var(--error); border-radius: 999px; cursor: pointer;
  }
  .skeleton { height: 66px; border-radius: 18px; background: var(--line); opacity: .5; animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: .6; } }

  @media (prefers-reduced-motion: reduce) {
    .link-card { transition: none; } .link-card:hover { transform: none; } .skeleton { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">HR</div>
    <h1>HR System</h1>
  </header>

  <main>
    <div class="intro">
      <h2>Welcome</h2>
      <p>Choose what you need.</p>
    </div>

    <nav id="links" aria-label="HR System links"></nav>

    <section class="section" aria-labelledby="jobs-title">
      <h2 id="jobs-title">Open Positions</h2>
      <p>Know someone who would be a great fit? Refer them.</p>
      <div id="positions" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
  /* ------------------------------------------------------------------
     TO ADD A NEW LINK: copy one line, change the values. No design change.
       icon = emoji, title, desc, href
       newTab: true  -> opens in a new tab (optional)
     ------------------------------------------------------------------ */
  const LINKS = [
    { icon: "📝", title: "Leave Request", desc: "Submit a new leave request",      href: "leave-request.html", newTab: true },
    { icon: "💬", title: "HR Chatbot",    desc: "Ask about the employee handbook", href: "chat.html" },
  ];

  /* ------------------------------------------------------------------
     OPEN POSITIONS come from the n8n workflow (GET webhook).
     Paste the PRODUCTION webhook URL below.
     The workflow must return: { "positions": [ { title, department, referralLink } ] }
     (a plain array of the same objects also works)
     ------------------------------------------------------------------ */
  const POSITIONS_URL = "https://adam3111.app.n8n.cloud/webhook/open-positions";
  const TIMEOUT_MS = 20000;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  /* ---------- Quick links ---------- */
  const nav = document.getElementById("links");
  for (const l of LINKS) {
    const a = el("a", "link-card");
    a.href = l.href;
    if (l.newTab) { a.target = "_blank"; a.rel = "noopener noreferrer"; }

    const text = el("div", "link-text");
    text.append(el("strong", "", l.title), el("span", "", l.desc));

    const arrow = el("div", "link-arrow", "→");
    arrow.setAttribute("aria-hidden", "true");

    a.append(el("div", "link-icon", l.icon), text, arrow);
    nav.append(a);
  }

  /* ---------- Open positions ---------- */
  const box = document.getElementById("positions");

  function showLoading() {
    box.replaceChildren(el("div", "skeleton"), el("div", "skeleton"));
  }

  function showError(msg) {
    const n = el("div", "note error", msg);
    const retry = el("button", "retry", "Retry");
    retry.type = "button";
    retry.addEventListener("click", loadPositions);
    n.append(retry);
    box.replaceChildren(n);
  }

  function safeUrl(u) {
    try {
      const url = new URL(String(u).trim());
      return /^https?:$/.test(url.protocol) ? url.href : null;
    } catch { return null; }
  }

  function render(list) {
    const cards = [];
    for (const p of list) {
      const title = String(p.title ?? "").trim();
      if (!title) continue;
      const card = el("div", "job");
      const text = el("div", "job-text");
      text.append(el("strong", "", title), el("span", "", String(p.department ?? "").trim()));
      card.append(text);

      const link = safeUrl(p.referralLink);
      if (link) {
        const btn = el("a", "refer", "Refer a Candidate");
        btn.href = link; btn.target = "_blank"; btn.rel = "noopener noreferrer";
        card.append(btn);
      }
      cards.push(card);
    }
    if (!cards.length) { box.replaceChildren(el("div", "note", "There are no open positions right now. Check back soon.")); return; }
    box.replaceChildren(...cards);
  }

  async function loadPositions() {
    showLoading();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      // Plain GET with no custom headers, so the browser sends no CORS preflight.
      const res = await fetch(POSITIONS_URL, { signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) throw new Error("status " + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (Array.isArray(data.positions) ? data.positions : []);
      render(list);
    } catch (err) {
      showError(err.name === "AbortError"
        ? "Loading positions is taking too long."
        : "Could not load open positions.");
    } finally {
      clearTimeout(timer);
    }
  }

  loadPositions();
</script>
</body>
</html>
