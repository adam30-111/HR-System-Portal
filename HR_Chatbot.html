<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #eef2f6;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6b82;
    --line: #cfd8e3;
    --accent: #0f6e8c;
    --accent-dark: #0b5a73;
    --accent-soft: #dcecf2;
    --error: #a63a2b;
    --error-soft: #f8e4e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Instrument Sans", system-ui, sans-serif;
  }
  .app {
    max-width: 760px; height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--paper); border-inline: 1px solid var(--line);
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .avatar {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #fff;
    font-weight: 600; font-size: .85rem;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .home {
    margin-inline-start: auto; padding: 7px 16px; text-decoration: none;
    font-size: .9rem; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border: 1.5px solid var(--accent-soft); border-radius: 999px;
  }
  .home:hover { border-color: var(--accent); }
  .home:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .row { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
  .row.user { justify-content: flex-end; }
  .row .avatar { width: 30px; height: 30px; font-size: .7rem; }

  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 18px;
    white-space: pre-wrap; word-break: break-word;
  }
  .bubble.user { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.bot { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .bubble.error { background: var(--error-soft); border-color: #e3b8b0; color: var(--error); }
  .bubble a { color: var(--accent); font-weight: 600; word-break: break-all; }

  .dots { display: flex; gap: 5px; padding: 6px 2px; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .6; } }

  form {
    display: flex; gap: 10px; padding: 14px 20px;
    background: var(--card); border-top: 1px solid var(--line);
  }
  input {
    flex: 1; min-width: 0; padding: 12px 16px; font: inherit; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px;
  }
  input:focus, button:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  button {
    padding: 0 22px; font: 600 1rem "Instrument Sans", sans-serif; color: #fff;
    background: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled, input:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">BP</div>
    <h1>HR Chatbot</h1>
    <a class="home" href="index.html">← Home</a>
  </header>

  <div id="chat" aria-live="polite"></div>

  <form id="form">
    <input id="q" type="text" placeholder="Type your message" autocomplete="off" required aria-label="Your message">
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  // Webhook URL (n8n Webhook node, method POST).
  const WEBHOOK_URL = "https://adam16777.app.n8n.cloud/webhook/BrightPath Solutions Chat";
  const TIMEOUT_MS = 90000;

  // One id per conversation. It stays the same until the page is reloaded,
  // so n8n's Simple Memory can tell conversations apart.
  const sessionId = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : String(Date.now()) + Math.random().toString(36).slice(2);

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const sendBtn = document.getElementById("send");

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Turns plain-text URLs into clickable links (document links from the bot).
  function renderText(bubble, text) {
    const urlPattern = /(https?:\/\/[^\s]+)/g;
    const parts = text.split(urlPattern);
    parts.forEach((part) => {
      if (/^https?:\/\//.test(part)) {
        const a = el("a", "", part);
        a.href = part;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        bubble.append(a);
      } else if (part) {
        bubble.append(document.createTextNode(part));
      }
    });
  }

  function addMessage(who, content, extraClass) {
    const row = el("div", "row " + who);
    if (who === "bot") row.append(el("div", "avatar", "BP"));
    const bubble = el("div", "bubble " + who + (extraClass ? " " + extraClass : ""));
    if (typeof content === "string") {
      if (who === "bot" && !extraClass) renderText(bubble, content);
      else bubble.textContent = content;
    } else {
      bubble.append(content);
    }
    row.append(bubble);
    chat.append(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function addTyping() {
    const dots = el("div", "dots");
    dots.append(el("span"), el("span"), el("span"));
    return addMessage("bot", dots);
  }

  // The reply can be an object or an array, with different key names.
  function getAnswer(data) {
    if (Array.isArray(data)) data = data[0] ?? {};
    if (typeof data === "string") return data.trim();
    for (const k of ["answer", "output", "text", "response", "result", "message"]) {
      if (typeof data[k] === "string" && data[k].trim()) return data[k].trim();
    }
    const first = Object.values(data).find(v => typeof v === "string" && v.trim());
    return first ? first.trim() : "";
  }

  addMessage("bot", "Hi! Ask me anything about the BrightPath employee handbook, or request an HR document.");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage("user", question);
    input.value = "";
    sendBtn.disabled = input.disabled = true;
    const typing = addTyping();

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, sessionId }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("The server answered with status " + res.status + ". Check that it is active.");
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch { data = raw; }
      const answer = getAnswer(data);
      typing.remove();
      if (answer) addMessage("bot", answer);
      else addMessage("bot", "No answer came back. Please try again.", "error");
    } catch (err) {
      typing.remove();
      addMessage("bot",
        err.name === "AbortError"
          ? "This is taking too long. Please try again."
          : err.message === "Failed to fetch"
            ? "Could not reach the server. Check the webhook URL, that it is active, and the CORS setting."
            : err.message,
        "error");
    } finally {
      clearTimeout(timer);
      sendBtn.disabled = input.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
