<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #eef2f6;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6b82;
    --line: #cfd8e3;
    --accent: #0f6e8c;
    --accent-dark: #0b5a73;
    --accent-soft: #dcecf2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Instrument Sans", system-ui, sans-serif;
  }
  .app {
    max-width: 760px; min-height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--paper); border-inline: 1px solid var(--line);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .avatar {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent); color: #fff;
    font-weight: 600; font-size: .85rem;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }

  main { flex: 1; padding: 28px 20px; }
  .intro { margin: 0 0 20px; }
  .intro h2 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 600; }
  .intro p { margin: 0; color: var(--muted); }

  /* The grid adapts to any number of links: 1 column on phones, 2 on wider screens */
  #links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

  .link-card {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 18px;
    transition: border-color .15s, transform .15s;
  }
  .link-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .link-card:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  .link-icon {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; background: var(--accent-soft); font-size: 1.3rem;
  }
  .link-text strong { display: block; font-weight: 600; }
  .link-text span { display: block; font-size: .88rem; color: var(--muted); }
  .link-arrow { margin-inline-start: auto; color: var(--accent); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { .link-card { transition: none; } .link-card:hover { transform: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">HR</div>
    <h1>HR System</h1>
  </header>

  <main>
    <div class="intro">
      <h2>Welcome</h2>
      <p>Choose what you need.</p>
    </div>
    <nav id="links" aria-label="HR System links"></nav>
  </main>
</div>

<script>
  /* ------------------------------------------------------------------
     TO ADD A NEW LINK: copy one line below, change the values, done.
     The page design does not need any change.
       icon  = any emoji
       title = card title
       desc  = short description
       href  = page URL
     ------------------------------------------------------------------ */
  const LINKS = [
    { icon: "📝", title: "Leave Request", desc: "Submit a new leave request",        href: "leave-request.html" },
    { icon: "💬", title: "HR Chatbot",    desc: "Ask about the employee handbook",   href: "chat.html" },
  ];

  const nav = document.getElementById("links");
  for (const l of LINKS) {
    const a = document.createElement("a");
    a.className = "link-card";
    a.href = l.href;

    const icon = document.createElement("div");
    icon.className = "link-icon";
    icon.textContent = l.icon;

    const text = document.createElement("div");
    text.className = "link-text";
    const t = document.createElement("strong"); t.textContent = l.title;
    const d = document.createElement("span");   d.textContent = l.desc;
    text.append(t, d);

    const arrow = document.createElement("div");
    arrow.className = "link-arrow";
    arrow.textContent = "→";
    arrow.setAttribute("aria-hidden", "true");

    a.append(icon, text, arrow);
    nav.append(a);
  }
</script>
</body>
</html>
